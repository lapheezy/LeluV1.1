# LÉLU CI — verification gate for the cognitive/memory/provider/tool
# architecture this repo's ongoing audit has been building and fixing.
#
# Runs on every push and PR so a change can never merge or deploy
# claiming "fixed"/"verified" without this actually passing:
#   - strict TypeScript across both project references (tsc -b)
#   - lint (oxlint)
#   - unit tests (`bun run test` = package.json's `test`: tsx, one file
#     at a time, live end-to-end file excluded — the same suite developers run)
#   - Session 02 environment & interface orchestration tests
#   - verified scripts/verify-*.ts runtime checks (cognition,
#     memory recall, offline brain, dev loop, UI action dispatch, tool
#     registry dispatch, startup diagnostics, …)
#   - a real production build (vite build) with bundle verification
#   - live runtime browser test with canary token leak detection
#
# A failed step here means the change is NOT verified — it blocks
# merge, it does not get silently reported as passing elsewhere.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 1. Lint
      - name: Lint (oxlint)
        run: bun run lint

      # 2. Typecheck & Build
      - name: Typecheck + build (tsc -b && vite build)
        run: bun run build

      # 3. Production bundle hygiene
      - name: Production bundle contains no test files
        run: node scripts/verify-no-tests-in-bundle.mjs dist

      # 4. Unit tests
      - name: Unit tests
        run: bun run test

      # 5. Environment & Interface Orchestration (Session 02)
      - name: Environment & Interface Orchestration tests
        run: |
          bun test tests/environment-orchestration-engine.test.ts \
                   tests/interface-orchestration.test.ts \
                   tests/e2e-demo-creation.test.ts \
                   tests/e2e-demo-development.test.ts \
                   tests/e2e-demo-research.test.ts

      # 6. Offline brain & cognition verification
      - name: Offline brain & cognition verification
        run: |
          bun run scripts/verify-offline-brain.ts
          bun run scripts/verify-offline-identity.ts
          bun run scripts/verify-cognition.ts
          bun run scripts/verify-memory-recall.ts
          bun run scripts/verify-curiosity.ts
          bun run scripts/verify-attention-bounds.ts
          bun run scripts/verify-bundle-secrets.ts
          bun run scripts/verify-endpoints.ts
          bun run scripts/verify-engineering-agent.ts
          bun run scripts/verify-init-race.ts
          bun run scripts/verify-media-browser.ts
          bun run scripts/verify-provider-health.ts
          bun run scripts/verify-providers.ts
          bun run scripts/verify-runtime-continuity.ts
          bun run scripts/verify-secrets.ts

      # 7. Development loop verification
      - name: Development loop verification
        run: bun run scripts/verify-development.ts

      # 8. Server-dependent engineering verification
      - name: Server-dependent engineering verification
        run: |
          bun run scripts/verify-engineering-chat.ts
          bun run scripts/verify-self-study.ts
          bun run scripts/verify-selfdev.ts
          bun run scripts/verify-startup-diagnostic.ts
          bun run scripts/verify-tool-execute.ts
          bun run scripts/verify-tool-registry.ts
          bun run scripts/verify-transform-command.ts
          bun run scripts/verify-ui-action-bus.ts
          bun run scripts/verify-ui-cognition-e2e.ts
          bun run scripts/verify-visual.ts
          bun run scripts/verify-voice.ts
          bun run scripts/verify-workspace.ts

      # 9. Live runtime + client secret scan (real browser)
      # GROQ_API_KEY is a canary: it is set server-side ONLY, and the
      # test fails if the browser can see it anywhere.
      - name: Live runtime + client secret scan (real browser)
        env:
          GROQ_API_KEY: gsk_CI_CANARY_MUSTNOTREACHTHEBROWSER
          LELU_LIVE_CANARY: gsk_CI_CANARY_MUSTNOTREACHTHEBROWSER
        run: |
          set -e
          bunx playwright install --with-deps chromium
          bun run preview &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/verify-live-runtime.mjs http://127.0.0.1:4173
