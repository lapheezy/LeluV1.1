# ==========================================================
# LÉLU — ANDROID DEBUG APK (cloud build, no local computer)
#
# Wraps the existing Vite/React web app in a Capacitor Android
# shell, then builds an installable debug APK on GitHub's hosted
# Linux runners. The web app itself is untouched.
#
# Output artifact: LELU-Android-debug.apk
#
# Trigger:
#   - push to `main`
#   - or manually: Actions → "Build Android APK" → Run workflow
#
# The APK is downloaded from the completed run's Artifacts section.
# ==========================================================
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 satisfies Capacitor 8's `node >= 22` requirement.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build LÉLU web app
        run: bun run build
        env:
          # Same client-side provider keys the web build already uses.
          # All optional: leave the corresponding GitHub secret unset
          # and the app still builds and runs its local/offline systems.
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GROQ_MODEL: ${{ secrets.VITE_GROQ_MODEL }}
          VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
          VITE_OPENROUTER_MODEL: ${{ secrets.VITE_OPENROUTER_MODEL }}
          VITE_CEREBRAS_API_KEY: ${{ secrets.VITE_CEREBRAS_API_KEY }}
          VITE_CEREBRAS_MODEL: ${{ secrets.VITE_CEREBRAS_MODEL }}
          VITE_MISTRAL_API_KEY: ${{ secrets.VITE_MISTRAL_API_KEY }}
          VITE_MISTRAL_MODEL: ${{ secrets.VITE_MISTRAL_MODEL }}
          VITE_FIREWORKS_API_KEY: ${{ secrets.VITE_FIREWORKS_API_KEY }}
          VITE_FIREWORKS_MODEL: ${{ secrets.VITE_FIREWORKS_MODEL }}
          VITE_GITHUB_TOKEN: ${{ secrets.VITE_GITHUB_TOKEN }}
          VITE_GITHUB_MODEL: ${{ secrets.VITE_GITHUB_MODEL }}
          VITE_AI_PROXY_BASE_URL: ${{ secrets.VITE_AI_PROXY_BASE_URL }}
          VITE_NEWS_API_KEY: ${{ secrets.VITE_NEWS_API_KEY }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}

      - name: Add Capacitor Android project
        run: |
          bunx cap add android
          # Reuse the committed PWA icon as the Android launcher/splash source.
          mkdir -p assets
          cp public/icon-512.png assets/icon.png
          cp public/icon-512.png assets/splash.png
          bunx capacitor-assets generate --android
          node scripts/prepare-android.mjs
          bunx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/

      - name: Verify APK metadata
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | tail -1 || true)
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging android/app/build/outputs/apk/debug/app-debug.apk | sed -n '1,6p'
          else
            echo "aapt unavailable; skipping badging dump (APK existence already verified)"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LELU-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
