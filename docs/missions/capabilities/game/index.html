<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LÉLU: Copper Roses Collector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Monospace', monospace;
      color: #e8e8e8;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #c9a84c;
      text-shadow: 0 0 10px rgba(201, 168, 76, 0.5);
    }
    #score {
      font-size: 1.2rem;
      margin-bottom: 1rem;
      color: #c9a84c;
    }
    #lives {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #e85c5c;
    }
    canvas {
      border: 2px solid #c9a84c;
      box-shadow: 0 0 20px rgba(201, 168, 76, 0.3);
      background: #0f0f1a;
      display: block;
    }
    #controls {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #888;
      text-align: center;
    }
    #game-over {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(26, 26, 46, 0.95);
      border: 2px solid #c9a84c;
      padding: 2rem;
      text-align: center;
      display: none;
      z-index: 100;
      box-shadow: 0 0 30px rgba(201, 168, 76, 0.4);
    }
    #game-over h2 {
      color: #c9a84c;
      margin-bottom: 1rem;
    }
    #game-over button {
      background: #c9a84c;
      border: none;
      color: #1a1a2e;
      padding: 0.75rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
      transition: background 0.2s;
    }
    #game-over button:hover {
      background: #e8c86c;
    }
  </style>
</head>
<body>
  <h1>LÉLU: Copper Roses Collector</h1>
  <div id="score">Score: 0</div>
  <div id="lives">Lives: 3</div>
  <canvas id="game" width="480" height="640"></canvas>
  <div id="controls">← → Arrow keys to move | Space to pause</div>
  <div id="game-over">
    <h2>Game Over</h2>
    <div id="final-score">Final Score: 0</div>
    <button id="restart">Play Again</button>
  </div>

  <script type="module" src="./game.js"></script>
</body>
</html>
