# ==========================================================
# LÉLU — NGINX (alternative to Caddy)
#
# Use this instead of deploy/Caddyfile if nginx is already on the box
# (apt install nginx certbot python3-certbot-nginx). Certbot writes the
# TLS lines; the blocks below are what must NOT be lost when it does.
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/lelu
#   ln -s /etc/nginx/sites-available/lelu /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d lelu.example.com
# ==========================================================

upstream lelu_runtime {
    server 127.0.0.1:4173;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name lelu.example.com;

    # certbot rewrites this to a redirect once a certificate exists.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lelu.example.com;

    # certbot manages these two lines.
    # ssl_certificate     /etc/letsencrypt/live/lelu.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/lelu.example.com/privkey.pem;

    # ---- compression -------------------------------------------------
    # Text only. Never compress an already-compressed model or image:
    # it costs CPU and changes nothing.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml
               application/xml text/xml;

    # nginx ships no brotli module by default. If `nginx -V` shows
    # --with-http_brotli, add:
    #   brotli on; brotli_types text/css application/javascript application/json image/svg+xml;

    # ---- second boundary: the engineering surface --------------------
    # 404, not 403: do not confirm the endpoints exist.
    location ^~ /api/engineer/ {
        return 404;
    }
    location = /api/browser/capture {
        return 404;
    }

    # ---- the app -----------------------------------------------------
    location / {
        proxy_pass http://lelu_runtime;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ranges and conditional requests must reach the runtime
        # intact. These are forwarded by default; stating them makes
        # the requirement explicit for whoever edits this next.
        proxy_set_header Range          $http_range;
        proxy_set_header If-Range       $http_if_range;
        proxy_set_header If-None-Match  $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;

        # Never buffer a model download or an event stream.
        proxy_buffering off;
        proxy_request_buffering off;

        # A 49 MB model over mobile data is slow, not broken.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # DO NOT add `expires 1y` or a blanket `Cache-Control` here.
    # The runtime decides the policy per asset class (hashed bundles
    # immutable, everything else must-revalidate). Overriding it at the
    # proxy is exactly how phones stopped updating.

    access_log /var/log/nginx/lelu.access.log;
    error_log  /var/log/nginx/lelu.error.log warn;
}
